name: Deploy to Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure SSH for GoDaddy legacy support
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 97.74.209.172 >> ~/.ssh/known_hosts
          cat << EOF >> ~/.ssh/config
          Host 97.74.209.172
            HostKeyAlgorithms +ssh-rsa
            PubkeyAcceptedKeyTypes +ssh-rsa
            PubkeyAcceptedAlgorithms +ssh-rsa
          EOF
          chmod 600 ~/.ssh/config ~/.ssh/known_hosts

      - name: Debug loaded keys in agent
        run: ssh-add -l

      - name: Test SSH connection (Verbose)
        run: |
          ssh -vvv -o StrictHostKeyChecking=no grxngcrukci1@97.74.209.172 '
            echo "SSH SUCCESS! User: $(whoami) | Dir: $(pwd)"
          '

      - name: Deploy to server
        if: success()  # Only run if test passes
        run: |
          ssh -o StrictHostKeyChecking=no grxngcrukci1@97.74.209.172 << 'EOF'
            set -e
            cd /home/grxngcrukci1/public_html/round8-backend-team-one.huma-volve.com
            git pull origin main
            echo "Deployment completed successfully!"
            # Easily extend: add Laravel commands below
            # composer install --no-dev --optimize-autoloader --no-interaction
            # php artisan migrate --force
            # php artisan config:cache
            # php artisan route:cache
            # php artisan view:cache
          EOF